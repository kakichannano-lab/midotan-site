<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みどたん 誕生日おめでとう！</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            transition: background 0.4s ease;
        }

        body.white-bg {
            background: #ffffff !important;
        }

        /* ボタンスタイル */
        .container {
            position: relative;
            z-index: 30;
            padding: 25px 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #9b59b6;
            box-shadow: 0 0 25px #2ecc71;
            border-radius: 15px;
            width: 88%;
            max-width: 400px;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.1s, opacity 0.4s;
        }

        .container:active {
            transform: scale(0.97);
        }

        .container.hide {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        h1 {
            color: #2ecc71;
            text-shadow: 0 0 10px #9b59b6;
            font-size: 1.5rem;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        h1 span {
            display: block;
        }

        p {
            color: #e0e0e0;
            font-size: 0.95rem;
            margin: 0 0 18px 0;
            line-height: 1.5;
        }

        .tap-guide {
            font-size: 0.85rem;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            border: 1px dashed #2ecc71;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.4; transform: scale(0.95); }
        }

        /* 立ち絵スタイル */
        #midori-chan {
            position: absolute;
            bottom: -150vh;
            left: 50%;
            transform: translateX(-50%);
            max-height: 95vh;
            max-width: 100vw;
            z-index: 10;
            pointer-events: none;
            transition: bottom 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.5s ease;
            mix-blend-mode: multiply;
            opacity: 0;
        }

        #midori-chan.show {
            bottom: 0;
            opacity: 1;
        }

        /* ぶどう用クラス */
        .falling-grape {
            position: absolute;
            pointer-events: none;
            z-index: 40;
            user-select: none;
            transition: top 0.4s linear, transform 0.4s linear;
        }

        /* 「チャレンジ！」ボタン（右上） */
        #challenge-btn {
            position: absolute;
            top: 25px;
            right: 20px;
            transform: scale(0);
            z-index: 50;
            background: rgba(255, 255, 255, 0.95);
            color: #9b59b6;
            border: 3px solid #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            line-height: 1.4;
            cursor: pointer;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.1s;
        }
        
        #challenge-btn:active {
            box-shadow: 0 0 5px rgba(255, 0, 255, 0.8);
        }

        #challenge-btn.show {
            transform: scale(1);
        }

        /* 肉まん画像 */
        #nikuman {
            position: absolute;
            z-index: 60;
            width: 140px;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 降ってくる画像（目に優しいふんわり半透明＆大きめサイズ） */
        .falling-image {
            position: absolute;
            top: -350px;
            width: 35vw; 
            max-width: 170px;
            height: auto;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            opacity: 0.85;
            animation: fallOnly linear forwards;
            pointer-events: none;
            z-index: 25;
        }

        @keyframes fallOnly {
            0% {
                transform: translateY(0);
                opacity: 0;
            }
            10% {
                opacity: 0.85;
            }
            90% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(calc(100vh + 400px));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <img id="midori-chan" src="IMG_3892.jpeg" alt="ミドリさん">
    
    <div id="challenge-btn" onclick="throwNikuman()">
        チャレンジ！<br>（タップ）
    </div>

    <img id="nikuman" src="IMG_3896.png" alt="肉まん">

    <!-- 最初および「NEXT！」用のコンテナ -->
    <div class="container" id="welcome-box" onclick="startShow()">
        <h1 id="box-title">
            <span>🎉 みどたん誕生日</span>
            <span>おめでとう！ 💜</span>
        </h1>
        <p id="box-text">いつも最高の配信をありがとう！<br>最高の1年になりますように！</p>
        <div class="tap-guide" id="box-guide">👇 タップしてお祝い！</div>
    </div>

    <script>
        // アップロードされた画像一覧（今回追加分の画像群をすべて網羅した配列）
        const shirasumanImages = [
            'IMG_5011.jpeg', 'IMG_5010.jpeg', 'IMG_5006.jpeg', 'IMG_5003.jpeg', 'IMG_5002.jpeg',
            'IMG_4999.jpeg', 'IMG_4996.jpeg', 'IMG_4992.jpeg', 'IMG_4983.jpeg', 'IMG_4982.jpeg',
            'IMG_4981.jpeg', 'IMG_4978.jpeg', 'IMG_7527.png',  'IMG_4971.jpeg', 'IMG_4968.jpeg',
            'IMG_4969.jpeg', 'IMG_4966.jpeg', 'IMG_4962.jpeg', 'IMG_4960.jpeg', 'IMG_4959.jpeg',
            'IMG_4806.jpeg', 'IMG_4956.jpeg', 'IMG_4955.jpeg', 'IMG_4953.jpeg', 'IMG_4945.jpeg',
            'IMG_7589.png',  'IMG_4940.jpeg', 'IMG_4936.jpeg', 'IMG_4931.jpeg', 'IMG_4934.jpeg',
            'IMG_4929.jpeg', 'IMG_7538.png',  'IMG_4916.jpeg', 'IMG_4911.jpeg', 'IMG_4906.jpeg',
            'IMG_4892.jpeg', 'IMG_4890.jpeg', 'IMG_4893.jpeg', 'IMG_4891.jpeg', 'IMG_4887.jpeg',
            'IMG_4869.jpeg', 'IMG_4863.jpeg', 'IMG_4860.jpeg', 'IMG_4858.jpeg', 'IMG_4853.jpeg',
            'IMG_4846.jpeg', 'IMG_4842.jpeg', 'IMG_4844.jpeg', 'IMG_4834.jpeg', 'IMG_4831.jpeg',
            'IMG_4821.jpeg', 'IMG_4817.jpeg', 'IMG_4814.jpeg', 'IMG_4804.jpeg', 'IMG_4803.jpeg',
            'IMG_4801.jpeg', 'IMG_4800.jpeg', 'IMG_4782.jpeg', 'IMG_4784.jpeg', 'IMG_4785.jpeg',
            'IMG_4783.jpeg', 'IMG_4734.jpeg', 'IMG_4732.jpeg', 'IMG_4727.jpeg', 'IMG_4725.jpeg',
            'IMG_4721.jpeg', 'IMG_4719.jpeg', 'IMG_4712.jpeg', 'IMG_4711.jpeg', 'IMG_4713.jpeg',
            'IMG_4707.jpeg', 'IMG_4695.jpeg', 'IMG_4697.jpeg', 'IMG_7528.png',  'IMG_4688.jpeg',
            'IMG_4685.jpeg', 'IMG_4683.jpeg', 'IMG_4678.jpeg', 'IMG_4670.jpeg', 'IMG_4668.jpeg',
            'IMG_4667.jpeg', 'IMG_4669.jpeg', 'IMG_4664.jpeg', 'IMG_4665.jpeg', 'IMG_4666.jpeg',
            'IMG_4662.jpeg', 'IMG_4658.jpeg', 'IMG_4656.jpeg', 'IMG_4655.jpeg', 'IMG_4650.jpeg',
            'IMG_4651.jpeg', 'IMG_4648.jpeg', 'IMG_4646.jpeg', 'IMG_4638.jpeg', 'IMG_4634.jpeg',
            'IMG_4630.jpeg', 'IMG_4627.jpeg', 'IMG_4624.jpeg', 'IMG_4621.jpeg',
            'IMG_4533.jpeg', 'IMG_4539.jpeg', 'IMG_4547.jpeg', 'IMG_4565.jpeg', 
            'IMG_4593.jpeg', 'IMG_4603.jpeg', 'IMG_4606.jpeg', 'IMG_4608.jpeg', 
            'IMG_4617.jpeg', 'IMG_4635.jpeg', 'IMG_4680.jpeg', 'IMG_4716.jpeg', 
            'IMG_4730.jpeg', 'IMG_4737.jpeg', 'IMG_4756.jpeg', 'IMG_4762.jpeg', 
            'IMG_4763.jpeg', 'IMG_4768.jpeg', 'IMG_4789.jpeg', 'IMG_4799.jpeg', 
            'IMG_4835.jpeg', 'IMG_4843.jpeg', 'IMG_4867.jpeg', 'IMG_4872.jpeg', 
            'IMG_4873.jpeg', 'IMG_4875.jpeg', 'IMG_4876.jpeg', 'IMG_4883.jpeg', 
            'IMG_4915.jpeg', 'IMG_4925.jpeg', 'IMG_4933.jpeg', 'IMG_4963.jpeg', 
            'IMG_4967.jpeg', 'IMG_4979.jpeg', 'IMG_4986.jpeg', 'IMG_4998.jpeg', 
            'IMG_5007.jpeg', 'IMG_7541.png'
        ];

        function startShow() {
            const body = document.body;
            const box = document.getElementById('welcome-box');
            const midori = document.getElementById('midori-chan');
            const challengeBtn = document.getElementById('challenge-btn');
            
            box.classList.add('hide');

            let grapeTimer = 0;
            let grapeInterval = setInterval(() => {
                for(let i = 0; i < 15; i++) {
                    let grape = document.createElement('div');
                    grape.classList.add('falling-grape');
                    grape.innerHTML = '🍇';
                    grape.style.fontSize = (Math.random() * 30 + 35) + 'px';
                    
                    let startX = Math.random() * window.innerWidth;
                    let stopY = Math.random() * window.innerHeight;

                    grape.style.left = startX + 'px';
                    grape.style.top = '-80px';
                    
                    document.body.appendChild(grape);

                    setTimeout(() => {
                        grape.style.top = stopY + 'px';
                        grape.style.transform = `rotate(${Math.random() * 360}deg) scale(${Math.random() * 0.5 + 1})`;
                    }, 20);

                    grape.classList.add('all-grapes');
                }

                grapeTimer += 50;

                if (grapeTimer >= 1200) {
                    clearInterval(grapeInterval);
                    document.querySelectorAll('.all-grapes').forEach(g => g.remove());

                    body.classList.add('white-bg');
                    midori.classList.add('show');

                    setTimeout(() => {
                        challengeBtn.classList.add('show');
                    }, 800);
                }
            }, 50);
        }

        function throwNikuman() {
            const body = document.body;
            const nikuman = document.getElementById('nikuman');
            const midori = document.getElementById('midori-chan');
            const box = document.getElementById('welcome-box');
            const boxTitle = document.getElementById('box-title');
            const boxText = document.getElementById('box-text');
            const boxGuide = document.getElementById('box-guide');
            
            const rect = midori.getBoundingClientRect();
            const faceX = rect.left + rect.width * 0.5;
            const faceY = rect.top + rect.height * 0.3;

            document.getElementById('challenge-btn').classList.remove('show');

            nikuman.style.left = faceX + 'px';
            nikuman.style.top = faceY + 'px';
            nikuman.style.opacity = '1';
            nikuman.style.transform = 'translate(-50%, -50%) scale(1.3) rotate(15deg)';

            setTimeout(() => {
                nikuman.style.transition = 'opacity 0.3s ease';
                nikuman.style.opacity = '0';

                midori.classList.remove('show');
                body.classList.remove('white-bg');

                setTimeout(() => {
                    boxTitle.innerHTML = '<span>🚀 NEXT！</span>';
                    boxText.style.display = 'none';
                    boxGuide.innerText = '👇 タップしてスタート！';
                    
                    box.onclick = function() {
                        box.classList.add('hide');
                        runShirasumanRain();
                    };

                    box.classList.remove('hide');
                }, 500);

            }, 1000);
        }

        function runShirasumanRain() {
            let index = 0;
            let screenWidth = window.innerWidth;
            const laneWidth = screenWidth / 3;

            let rainInterval = setInterval(() => {
                if (index < shirasumanImages.length) {
                    let lane = index % 3;
                    let xPos = lane * laneWidth + (laneWidth - 150) / 2 + (Math.random() * 30 - 15);

                    createSingleImage(shirasumanImages[index], xPos);
                    index++;
                } else {
                    clearInterval(rainInterval);

                    setTimeout(() => {
                        showNextButton();
                    }, 3800);
                }
            }, 220);
        }

        function createSingleImage(imageSrc, xPos) {
            const img = document.createElement('img');
            img.src = imageSrc;
            img.className = 'falling-image';
            img.style.left = xPos + 'px';

            const duration = 3.5;
            img.style.animationDuration = duration + 's';

            document.body.appendChild(img);

            setTimeout(() => {
                img.remove();
            }, duration * 1000);
        }

        function showNextButton() {
            const box = document.getElementById('welcome-box');
            const boxTitle = document.getElementById('box-title');
            const boxGuide = document.getElementById('box-guide');

            boxTitle.innerHTML = '<span>🚀 NEXT！</span>';
            boxGuide.innerText = '👇 タップして次へ！';
            
            box.onclick = function() {
                alert('次のNEXTへ進みます！');
            };

            box.classList.remove('hide');
        }
    </script>

</body>
</html>

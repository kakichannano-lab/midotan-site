<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みどたん 誕生日おめでとう！</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        /* 立ち絵のスタイル（背景の白い部分や四角さをカバーしつつ綺麗に配置） */
        #midori-chan {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            max-height: 95vh;
            max-width: 100vw;
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 0 25px rgba(46, 204, 113, 0.6));
        }

        /* 紙吹雪のスタイル */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }

        .petal {
            position: absolute;
            background: #2ecc71;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: blowUp 4s linear infinite;
            z-index: 2;
        }

        @keyframes blowUp {
            0% {
                transform: scale(0.2) translateY(100vh) translateX(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: scale(1.5) translateY(-20vh) translateX(50px);
                opacity: 0;
            }
        }
    </style>
</head>
<body onclick="triggerCelebration()">

    <!-- 立ち絵画像 -->
    <img id="midori-chan" src="IMG_3875.jpeg" alt="ミドリさん">

    <script>
        // 背景の花びらエフェクト
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 20 + 10;
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            petal.style.left = Math.random() * window.innerWidth + 'px';
            
            petal.style.background = Math.random() > 0.5 ? '#2ecc71' : '#9b59b6';
            petal.style.boxShadow = '0 0 10px ' + petal.style.background;
            petal.style.animationDuration = (Math.random() * 2 + 3) + 's';

            document.body.appendChild(petal);

            setTimeout(() => {
                petal.remove();
            }, 4000);
        }

        setInterval(createPetal, 300);

        // 画面どこをタップしても紙吹雪がドーンと舞う演出
        function triggerCelebration() {
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                const colors = ['#2ecc71', '#9b59b6', '#ffffff', '#f1c40f'];
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                if (Math.random() > 0.5) {
                    confetti.style.borderRadius = '50%';
                }

                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.animation = `confettiFall ${Math.random() * 2 + 2}s linear forwards`;

                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みどたん 誕生日おめでとう！</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            transition: background 0.3s ease;
        }

        body.white-bg {
            background: #ffffff !important;
        }

        /* 最初に出るお祝いボタン */
        .container {
            position: relative;
            z-index: 30;
            padding: 25px 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #9b59b6;
            box-shadow: 0 0 25px #2ecc71;
            border-radius: 15px;
            width: 88%;
            max-width: 400px;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.1s, opacity 0.4s;
        }

        .container:active {
            transform: scale(0.97);
        }

        .container.hide {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        h1 {
            color: #2ecc71;
            text-shadow: 0 0 10px #9b59b6;
            font-size: 1.5rem;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        h1 span {
            display: block;
        }

        p {
            color: #e0e0e0;
            font-size: 0.95rem;
            margin: 0 0 18px 0;
            line-height: 1.5;
        }

        .tap-guide {
            font-size: 0.85rem;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            border: 1px dashed #2ecc71;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.4; transform: scale(0.95); }
        }

        /* 立ち絵スタイル */
        #midori-chan {
            position: absolute;
            bottom: -150vh;
            left: 50%;
            transform: translateX(-50%);
            max-height: 95vh;
            max-width: 100vw;
            z-index: 10;
            pointer-events: none;
            transition: bottom 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            mix-blend-mode: multiply;
        }

        #midori-chan.show {
            bottom: 0;
        }

        /* ぶどう用クラス */
        .falling-grape {
            position: absolute;
            pointer-events: none;
            z-index: 40;
            user-select: none;
            transition: top 0.4s linear, transform 0.4s linear;
        }
    </style>
</head>
<body>

    <img id="midori-chan" src="IMG_3892.jpeg" alt="ミドリさん">

    <div class="container" id="welcome-box" onclick="startShow()">
        <h1>
            <span>🎉 みどたん誕生日</span>
            <span>おめでとう！ 💜</span>
        </h1>
        <p>いつも最高の配信をありがとう！<br>最高の1年になりますように！</p>
        <div class="tap-guide">👇 タップしてお祝い！</div>
    </div>

    <script>
        function startShow() {
            const body = document.body;
            const box = document.getElementById('welcome-box');
            const midori = document.getElementById('midori-chan');
            
            box.classList.add('hide');

            // ぶどうを爆速・大量発生させて画面を一瞬で埋め尽くす (約1.5秒間)
            let grapeTimer = 0;
            let grapeInterval = setInterval(() => {
                // 1回につき15個のぶどうを画面全体のランダムな位置に一気に降らせる
                for(let i = 0; i < 15; i++) {
                    let grape = document.createElement('div');
                    grape.classList.add('falling-grape');
                    grape.innerHTML = '🍇';
                    grape.style.fontSize = (Math.random() * 30 + 35) + 'px'; // 大きめサイズ
                    
                    let startX = Math.random() * window.innerWidth;
                    let stopY = Math.random() * window.innerHeight; // 画面の至るところに散らばる

                    grape.style.left = startX + 'px';
                    grape.style.top = '-80px';
                    
                    document.body.appendChild(grape);

                    // 爆速で落ちて画面全体を埋める
                    setTimeout(() => {
                        grape.style.top = stopY + 'px';
                        grape.style.transform = `rotate(${Math.random() * 360}deg) scale(${Math.random() * 0.5 + 1})`;
                    }, 20);

                    // 後で一括消去するためのクラス
                    grape.classList.add('all-grapes');
                }

                grapeTimer += 50;

                // 1.2秒経ったらぶどうの発生を止め、画面を真っ白にして立ち絵を出す
                if (grapeTimer >= 1200) {
                    clearInterval(grapeInterval);

                    // ぶどうを一斉に消す
                    document.querySelectorAll('.all-grapes').forEach(g => g.remove());

                    // 背景を真っ白にして立ち絵登場！
                    body.classList.add('white-bg');
                    midori.classList.add('show');
                }
            }, 50);
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みどたん 誕生日おめでとう！</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            transition: background 0.4s ease;
        }

        body.white-bg {
            background: #ffffff !important;
        }

        #music-start-box {
            position: relative;
            z-index: 40;
            padding: 22px 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #2ecc71;
            box-shadow: 0 0 25px #2ecc71;
            border-radius: 15px;
            width: 90%;
            max-width: 420px;
            cursor: pointer;
            box-sizing: border-box;
            margin-bottom: 20px;
            transition: transform 0.1s, opacity 0.4s;
        }

        #music-start-box:active {
            transform: scale(0.97);
        }

        #music-start-box.hide {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .music-title {
            color: #2ecc71;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .music-guide {
            font-size: 0.85rem;
            color: #fff;
            background: rgba(46, 204, 113, 0.2);
            padding: 6px 12px;
            border-radius: 15px;
            display: inline-block;
            border: 1px dashed #2ecc71;
        }

        .container {
            position: relative;
            z-index: 30;
            padding: 25px 15px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #9b59b6;
            box-shadow: 0 0 25px #9b59b6;
            border-radius: 15px;
            width: 90%;
            max-width: 420px;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.1s, opacity 0.4s;
            display: none;
        }

        .container.show {
            display: block;
        }

        .container:active {
            transform: scale(0.97);
        }

        .container.hide {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        h1 {
            color: #2ecc71;
            text-shadow: 0 0 10px #9b59b6;
            font-size: 1.4rem;
            margin: 0 0 10px 0;
            line-height: 1.4;
            word-break: break-all;
        }

        h1 span {
            display: block;
        }

        .tap-guide {
            font-size: 0.9rem;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            border: 1px dashed #2ecc71;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.4; transform: scale(0.95); }
        }

        #midori-chan {
            position: absolute;
            bottom: -150vh;
            left: 50%;
            transform: translateX(-50%);
            max-height: 95vh;
            max-width: 100vw;
            z-index: 10;
            pointer-events: none;
            transition: bottom 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.5s ease;
            mix-blend-mode: multiply;
            opacity: 0;
        }

        #midori-chan.show {
            bottom: 0;
            opacity: 1;
        }

        .falling-grape {
            position: absolute;
            pointer-events: none;
            z-index: 40;
            user-select: none;
            transition: top 0.4s linear, transform 0.4s linear;
        }

        #challenge-btn {
            position: absolute;
            top: 25px;
            right: 20px;
            transform: scale(0);
            z-index: 50;
            background: rgba(255, 255, 255, 0.95);
            color: #9b59b6;
            border: 3px solid #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            line-height: 1.4;
            cursor: pointer;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.1s;
        }
        
        #challenge-btn:active {
            box-shadow: 0 0 5px rgba(255, 0, 255, 0.8);
        }

        #challenge-btn.show {
            transform: scale(1);
        }

        #nikuman {
            position: absolute;
            z-index: 60;
            width: 140px;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .falling-image {
            position: absolute;
            top: -350px;
            width: 32vw; 
            max-width: 160px;
            height: auto;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            opacity: 0.85;
            animation: fallOnly linear forwards;
            pointer-events: none;
            z-index: 25;
        }

        @keyframes fallOnly {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.85; }
            90% { opacity: 0.85; }
            100% { transform: translateY(calc(100vh + 400px)); opacity: 0; }
        }

        .shape-photo {
            position: absolute;
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #fff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            z-index: 35;
            opacity: 0;
            transform: scale(0);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .shape-photo.show {
            opacity: 1;
            transform: scale(1);
        }

        #final-card {
            position: absolute;
            z-index: 50;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ff69b4;
            box-shadow: 0 0 30px #ff69b4;
            border-radius: 20px;
            padding: 25px 20px;
            width: 88%;
            max-width: 380px;
            text-align: center;
            box-sizing: border-box;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #final-card.show {
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>

        <source src="Love2.mp3" type="audio/mp3">

    </div>

        </h1>
        <div class="tap-guide" id="box-guide">（タップ）</div>
    </div>

    <div id="final-card">
        <h1 style="color: #ff69b4; text-shadow: 0 0 10px #ff69b4; font-size: 1.2rem; margin-bottom: 12px;">
            ✨ Happy Birthday ✨
        </h1>
        <div style="font-size: 0.9rem; line-height: 1.6; text-align: left; background: rgba(255,105,180,0.1); padding: 12px; border-radius: 10px; border: 1px dashed #ff69b4;">
            改めて誕生日おめでとうございます🎉<br>
            みどたんにはこの1年間、色々なところで助けてもらいました！<br>
            これからも勝手に応援し続けます😊<br>
            素敵な一年にしてください！
        </div>
        <div style="margin-top: 15px; font-size: 0.8rem; color: #aaa;">（おしまい・素敵な1年を！）</div>

            document.getElementById('welcome-box').classList.add('show');

        function startShow() {
            const body = document.body;
            const box = document.getElementById('welcome-box');
            const midori = document.getElementById('midori-chan');
            const challengeBtn = document.getElementById('challenge-btn');
            
            box.classList.add('hide');

            let grapeTimer = 0;
            let grapeInterval = setInterval(() => {
                for(let i = 0; i < 15; i++) {
                    let grape = document.createElement('div');
                    grape.classList.add('falling-grape');
                    grape.innerHTML = '🍇';
                    grape.style.fontSize = (Math.random() * 30 + 35) + 'px';
                    
                    let startX = Math.random() * window.innerWidth;
                    let stopY = Math.random() * window.innerHeight;

                    grape.style.left = startX + 'px';
                    grape.style.top = '-80px';
                    
                    document.body.appendChild(grape);

                    setTimeout(() => {
                        grape.style.top = stopY + 'px';
                        grape.style.transform = `rotate(${Math.random() * 360}deg) scale(${Math.random() * 0.5 + 1})`;
                    }, 20);

                    grape.classList.add('all-grapes');
                }

                grapeTimer += 50;

                if (grapeTimer >= 1200) {
                    clearInterval(grapeInterval);
                    document.querySelectorAll('.all-grapes').forEach(g => g.remove());

                    body.classList.add('white-bg');
                    midori.classList.add('show');

                    setTimeout(() => {
                        challengeBtn.classList.add('show');
                    }, 800);
                }
            }, 50);
        }

        function throwNikuman() {
            const body = document.body;
            const nikuman = document.getElementById('nikuman');
            const midori = document.getElementById('midori-chan');
            const box = document.getElementById('welcome-box');
            
            const rect = midori.getBoundingClientRect();
            const faceX = rect.left + rect.width * 0.5;
            const faceY = rect.top + rect.height * 0.3;

            document.getElementById('challenge-btn').classList.remove('show');

            nikuman.style.left = faceX + 'px';
            nikuman.style.top = faceY + 'px';
            nikuman.style.opacity = '1';
            nikuman.style.transform = 'translate(-50%, -50%) scale(1.3) rotate(15deg)';

            setTimeout(() => {
                nikuman.style.transition = 'opacity 0.3s ease';
                nikuman.style.opacity = '0';

                midori.classList.remove('show');
                body.classList.remove('white-bg');

                setTimeout(() => {
                    showNextButton("NEXT", () => {
                        box.classList.add('hide');
                        runImageRain(firstGroupList, () => {
                            showShapeCollage(firstGroupList, 'star', () => {
                                showNextButton("NEXT", () => {
                                    box.classList.add('hide');
                                    runImageRain(photoList, () => {
                                        // 2回目：王冠（しっかり形が出るように修正！）
                                        showShapeCollage(photoList, 'crown', () => {
                                            showNextButton("NEXT", () => {
                                                box.classList.add('hide');
                                                runImageRain(giftList, () => {
                                                    // 最後：しらすまん（肉まん型）
                                                    showShapeCollage(giftList, 'nikuman', () => {
                                                        const finalCard = document.getElementById('final-card');
                                                        finalCard.classList.add('show');
                                                    });
                                                });
                                            });
                                        });
                                    });
                                });
                            });
                        });
                    });
                }, 500);

            }, 1000);
        }

        function runImageRain(imageList, onComplete) {
            let index = 0;
            let screenWidth = window.innerWidth;
            const laneWidth = screenWidth / 3;

            let rainInterval = setInterval(() => {
                if (index < imageList.length) {
                    let lane = index % 3;
                    let xPos = lane * laneWidth + (laneWidth - 140) / 2 + (Math.random() * 20 - 10);

                    createSingleImage(imageList[index], xPos);
                    index++;
                } else {
                    clearInterval(rainInterval);

                    setTimeout(() => {
                        if (onComplete) onComplete();
                    }, 3800);
                }
            }, 220);
        }

        function createSingleImage(imageSrc, xPos) {
            const img = document.createElement('img');
            img.src = imageSrc;
            img.className = 'falling-image';
            img.style.left = xPos + 'px';

            const duration = 3.5;
            img.style.animationDuration = duration + 's';

            document.body.appendChild(img);

            setTimeout(() => {
                img.remove();
            }, duration * 1000);
        }

        function showNextButton(text, onClickCallback) {
            const box = document.getElementById('welcome-box');
            const boxTitle = document.getElementById('box-title');
            const boxGuide = document.getElementById('box-guide');

            boxTitle.innerText = text;
            boxGuide.innerText = '（タップ）';
            box.onclick = onClickCallback;
            box.classList.remove('hide');
        }

        function showShapeCollage(imageList, shapeType, onComplete) {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const totalPhotos = Math.min(imageList.length, 32); 
            let photos = [];

            for (let i = 0; i < totalPhotos; i++) {
                let hx = 0, hy = 0;
                let scale = Math.min(window.innerWidth, window.innerHeight) / 14;

                if (shapeType === 'nikuman') {
                    let angle = (i / totalPhotos) * Math.PI * 2;
                    hx = Math.sin(angle) * 4.5;
                    hy = Math.cos(angle) * 3.8 - (Math.sin(angle) > 0 ? 0.5 : 0);
                } else if (shapeType === 'star') {
                    let angle = (i / totalPhotos) * Math.PI * 2;
                    let r = (i % 2 === 0) ? 5 : 2.5;
                    hx = r * Math.cos(angle) * 1.8;
                    hy = r * Math.sin(angle) * 1.8;
                } else if (shapeType === 'crown') {
                    // 王冠らしくギザギザと上に尖る形にする計算
                    let progress = i / totalPhotos;
                    hx = (progress - 0.5) * 8; 
                    // 左右の端と中央、3箇所がピョコっと高くなる王冠のライン
                    hy = -Math.abs(Math.sin(progress * Math.PI * 3)) * 2.5 - 1.0;
                }

                let posX = centerX + hx * scale - 21;
                let posY = centerY + hy * scale - 21;

                let img = document.createElement('img');
                img.src = imageList[i % imageList.length];
                img.className = 'shape-photo';
                img.style.left = posX + 'px';
                img.style.top = posY + 'px';

                document.body.appendChild(img);
                photos.push(img);

                setTimeout(() => {
                    img.classList.add('show');
                }, i * 35);
            }

            let displayDuration = (shapeType === 'nikuman') ? 0 : 2200;
            
            if (displayDuration > 0) {
                setTimeout(() => {
                    photos.forEach(img => {
                        img.style.opacity = '0';
                        img.style.transform = 'scale(0)';
                    });
                    setTimeout(() => {
                        photos.forEach(img => img.remove());
                        if (onComplete) onComplete();
                    }, 600);
                }, totalPhotos * 35 + displayDuration);
            } else {
                setTimeout(() => {
                    if (onComplete) onComplete();
                }, totalPhotos * 35 + 300);
            }
        }

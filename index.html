<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みどたん 誕生日おめでとう！</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        /* 最初に出るお祝いボタン */
        .container {
            position: relative;
            z-index: 30;
            padding: 25px 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #9b59b6;
            box-shadow: 0 0 25px #2ecc71;
            border-radius: 15px;
            width: 88%;
            max-width: 400px;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.1s, opacity 0.4s;
        }

        .container:active {
            transform: scale(0.97);
        }

        .container.hide {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        h1 {
            color: #2ecc71;
            text-shadow: 0 0 10px #9b59b6;
            font-size: 1.5rem;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        h1 span {
            display: block;
        }

        p {
            color: #e0e0e0;
            font-size: 0.95rem;
            margin: 0 0 18px 0;
            line-height: 1.5;
        }

        .tap-guide {
            font-size: 0.85rem;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            border: 1px dashed #2ecc71;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.4; transform: scale(0.95); }
        }

        /* 立ち絵のスタイル（キャラクター本来の色を保ったまま綺麗に配置） */
        #midori-chan {
            position: absolute;
            bottom: -150vh;
            left: 50%;
            transform: translateX(-50%);
            max-height: 95vh;
            max-width: 100vw;
            z-index: 10;
            pointer-events: none;
            transition: bottom 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            filter: drop-shadow(0 0 25px rgba(46, 204, 113, 0.6));
        }

        #midori-chan.show {
            bottom: 0;
        }

        /* 紙吹雪のスタイル */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }

        .petal {
            position: absolute;
            background: #2ecc71;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: blowUp 4s linear infinite;
            z-index: 2;
        }

        @keyframes blowUp {
            0% {
                transform: scale(0.2) translateY(100vh) translateX(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: scale(1.5) translateY(-20vh) translateX(50px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- 立ち絵画像 -->
    <img id="midori-chan" src="IMG_3887.jpeg" alt="ミドリさん">

    <!-- 最初に出るお祝いボタン -->
    <div class="container" id="welcome-box" onclick="triggerCelebration()">
        <h1>
            <span>🎉 みどたん誕生日</span>
            <span>おめでとう！ 💜</span>
        </h1>
        <p>いつも最高の配信をありがとう！<br>最高の1年になりますように！</p>
        <div class="tap-guide">👇 タップしてお祝い！</div>
    </div>

    <script>
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 20 + 10;
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            petal.style.left = Math.random() * window.innerWidth + 'px';
            
            petal.style.background = Math.random() > 0.5 ? '#2ecc71' : '#9b59b6';
            petal.style.boxShadow = '0 0 10px ' + petal.style.background;
            petal.style.animationDuration = (Math.random() * 2 + 3) + 's';

            document.body.appendChild(petal);

            setTimeout(() => {
                petal.remove();
            }, 4000);
        }

        setInterval(createPetal, 300);

        function triggerCelebration() {
            const box = document.getElementById('welcome-box');
            const midori = document.getElementById('midori-chan');
            
            box.classList.add('hide');
            midori.classList.add('show');
            
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                const colors = ['#2ecc71', '#9b59b6', '#ffffff', '#f1c40f'];
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                if (Math.random() > 0.5) {
                    confetti.style.borderRadius = '50%';
                }

                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.animation = `confettiFall ${Math.random() * 2 + 2}s linear forwards`;

                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みどたん 誕生日おめでとう！</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            transition: background 0.4s ease;
        }

        body.white-bg {
            background: #ffffff !important;
        }

        /* 最初に出るお祝いボタン */
        .container {
            position: relative;
            z-index: 30;
            padding: 25px 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #9b59b6;
            box-shadow: 0 0 25px #2ecc71;
            border-radius: 15px;
            width: 88%;
            max-width: 400px;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.1s, opacity 0.4s;
        }

        .container:active {
            transform: scale(0.97);
        }

        .container.hide {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        h1 {
            color: #2ecc71;
            text-shadow: 0 0 10px #9b59b6;
            font-size: 1.5rem;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        h1 span {
            display: block;
        }

        p {
            color: #e0e0e0;
            font-size: 0.95rem;
            margin: 0 0 18px 0;
            line-height: 1.5;
        }

        .tap-guide {
            font-size: 0.85rem;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            border: 1px dashed #2ecc71;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.4; transform: scale(0.95); }
        }

        /* 立ち絵スタイル */
        #midori-chan {
            position: absolute;
            bottom: -150vh;
            left: 50%;
            transform: translateX(-50%);
            max-height: 95vh;
            max-width: 100vw;
            z-index: 10;
            pointer-events: none;
            transition: bottom 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            mix-blend-mode: multiply;
        }

        #midori-chan.show {
            bottom: 0;
        }

        /* エフェクト用共通クラス */
        .falling-item {
            position: absolute;
            pointer-events: none;
            z-index: 40;
            user-select: none;
        }

        /* ミントぶん投げアニメーション */
        @keyframes throwMint {
            0% {
                transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.5) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <img id="midori-chan" src="IMG_3892.jpeg" alt="ミドリさん">

    <div class="container" id="welcome-box" onclick="startShow()">
        <h1>
            <span>🎉 みどたん誕生日</span>
            <span>おめでとう！ 💜</span>
        </h1>
        <p>いつも最高の配信をありがとう！<br>最高の1年になりますように！</p>
        <div class="tap-guide">👇 タップしてお祝い！</div>
    </div>

    <script>
        function createPetal() {
            const petal = document.createElement('div');
            petal.style.position = 'absolute';
            petal.style.width = (Math.random() * 20 + 10) + 'px';
            petal.style.height = petal.style.width;
            petal.style.left = Math.random() * window.innerWidth + 'px';
            petal.style.top = '-20px';
            petal.style.background = Math.random() > 0.5 ? '#2ecc71' : '#9b59b6';
            petal.style.borderRadius = '50%';
            petal.style.opacity = '0.8';
            petal.style.zIndex = '2';
            petal.style.pointerEvents = 'none';
            petal.style.transition = 'transform 4s linear, top 4s linear';

            document.body.appendChild(petal);

            setTimeout(() => {
                petal.style.top = '105vh';
                petal.style.transform = `translateX(${(Math.random() - 0.5) * 200}px) rotate(360deg)`;
            }, 50);

            setTimeout(() => {
                petal.remove();
            }, 4100);
        }

        setInterval(createPetal, 300);

        function startShow() {
            const body = document.body;
            const box = document.getElementById('welcome-box');
            const midori = document.getElementById('midori-chan');
            
            box.classList.add('hide');

            // 1. ぶどうが画面を埋め尽くすように大量に降ってきて下に溜まる演出 (約2.5秒間)
            let grapeInterval = setInterval(() => {
                // 1回に複数のぶどうを降らせて画面を素早く埋め尽くす
                for(let i = 0; i < 4; i++) {
                    let grape = document.createElement('div');
                    grape.classList.add('falling-item');
                    grape.innerHTML = '🍇';
                    grape.style.fontSize = (Math.random() * 25 + 30) + 'px';
                    grape.style.left = Math.random() * (window.innerWidth - 50) + 'px';
                    grape.style.top = '-60px';
                    
                    // 下から積み重なるようにランダムな位置に停止
                    let stopY = window.innerHeight - (Math.random() * window.innerHeight * 0.75 + 10);
                    let duration = Math.random() * 0.8 + 1.0;

                    grape.style.transition = `top ${duration}s ease-in, transform ${duration}s ease-in`;
                    document.body.appendChild(grape);

                    setTimeout(() => {
                        grape.style.top = stopY + 'px';
                        grape.style.transform = `rotate(${Math.random() * 360}deg)`;
                    }, 50);

                    grape.classList.add('stacked-grape');
                }
            }, 50);

            // 2. 2.5秒後にぶどうの追加を止め、画面が埋まった状態から一気に立ち絵＆白背景に切り替える
            setTimeout(() => {
                clearInterval(grapeInterval);

                // 溜まったぶどうを消す
                document.querySelectorAll('.stacked-grape').forEach(g => g.remove());

                // 背景を白にして立ち絵登場
                body.classList.add('white-bg');
                midori.classList.add('show');

                // 3. ミントをぶん投げる演出 (🌿)
                for (let i = 0; i < 25; i++) {
                    let mint = document.createElement('div');
                    mint.classList.add('falling-item');
                    mint.innerHTML = '🌿';
                    mint.style.fontSize = (Math.random() * 25 + 25) + 'px';
                    
                    mint.style.left = '50%';
                    mint.style.top = '50%';

                    let dx = (Math.random() - 0.5) * window.innerWidth * 0.9;
                    let dy = (Math.random() - 0.5) * window.innerHeight * 0.9;
                    mint.style.setProperty('--dx', dx + 'px');
                    mint.style.setProperty('--dy', dy + 'px');

                    mint.style.animation = `throwMint 0.8s ease-out forwards`;
                    document.body.appendChild(mint);

                    setTimeout(() => mint.remove(), 800);
                }

            }, 2500);
        }
    </script>

</body>
</html>

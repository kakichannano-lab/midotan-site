<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みどたん 誕生日おめでとう！</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            transition: background 0.4s ease;
        }

        body.white-bg {
            background: #ffffff !important;
        }

        /* ボタンスタイル */
        .container {
            position: relative;
            z-index: 30;
            padding: 25px 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #9b59b6;
            box-shadow: 0 0 25px #2ecc71;
            border-radius: 15px;
            width: 88%;
            max-width: 400px;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.1s, opacity 0.4s;
        }

        .container:active {
            transform: scale(0.97);
        }

        .container.hide {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        h1 {
            color: #2ecc71;
            text-shadow: 0 0 10px #9b59b6;
            font-size: 1.5rem;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        h1 span {
            display: block;
        }

        p {
            color: #e0e0e0;
            font-size: 0.95rem;
            margin: 0 0 18px 0;
            line-height: 1.5;
        }

        .tap-guide {
            font-size: 0.85rem;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            border: 1px dashed #2ecc71;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.4; transform: scale(0.95); }
        }

        /* 立ち絵スタイル */
        #midori-chan {
            position: absolute;
            bottom: -150vh;
            left: 50%;
            transform: translateX(-50%);
            max-height: 95vh;
            max-width: 100vw;
            z-index: 10;
            pointer-events: none;
            transition: bottom 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.5s ease;
            mix-blend-mode: multiply;
            opacity: 0;
        }

        #midori-chan.show {
            bottom: 0;
            opacity: 1;
        }

        /* ぶどう用クラス */
        .falling-grape {
            position: absolute;
            pointer-events: none;
            z-index: 40;
            user-select: none;
            transition: top 0.4s linear, transform 0.4s linear;
        }

        /* 「チャレンジ！」ボタン（右上） */
        #challenge-btn {
            position: absolute;
            top: 25px;
            right: 20px;
            transform: scale(0);
            z-index: 50;
            background: rgba(255, 255, 255, 0.95);
            color: #9b59b6;
            border: 3px solid #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            line-height: 1.4;
            cursor: pointer;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.1s;
        }
        
        #challenge-btn:active {
            box-shadow: 0 0 5px rgba(255, 0, 255, 0.8);
        }

        #challenge-btn.show {
            transform: scale(1);
        }

        /* 肉まん画像 */
        #nikuman {
            position: absolute;
            z-index: 60;
            width: 140px;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body>

    <img id="midori-chan" src="IMG_3892.jpeg" alt="ミドリさん">
    
    <div id="challenge-btn" onclick="throwNikuman()">
        チャレンジ！<br>（タップ）
    </div>

    <img id="nikuman" src="IMG_3896.png" alt="肉まん">

    <!-- 最初および「NEXT！」用のコンテナ -->
    <div class="container" id="welcome-box" onclick="startShow()">
        <h1 id="box-title">
            <span>🎉 みどたん誕生日</span>
            <span>おめでとう！ 💜</span>
        </h1>
        <p id="box-text">いつも最高の配信をありがとう！<br>最高の1年になりますように！</p>
        <div class="tap-guide" id="box-guide">👇 タップしてお祝い！</div>
    </div>

    <script>
        function startShow() {
            const body = document.body;
            const box = document.getElementById('welcome-box');
            const midori = document.getElementById('midori-chan');
            const challengeBtn = document.getElementById('challenge-btn');
            
            box.classList.add('hide');

            let grapeTimer = 0;
            let grapeInterval = setInterval(() => {
                for(let i = 0; i < 15; i++) {
                    let grape = document.createElement('div');
                    grape.classList.add('falling-grape');
                    grape.innerHTML = '🍇';
                    grape.style.fontSize = (Math.random() * 30 + 35) + 'px';
                    
                    let startX = Math.random() * window.innerWidth;
                    let stopY = Math.random() * window.innerHeight;

                    grape.style.left = startX + 'px';
                    grape.style.top = '-80px';
                    
                    document.body.appendChild(grape);

                    setTimeout(() => {
                        grape.style.top = stopY + 'px';
                        grape.style.transform = `rotate(${Math.random() * 360}deg) scale(${Math.random() * 0.5 + 1})`;
                    }, 20);

                    grape.classList.add('all-grapes');
                }

                grapeTimer += 50;

                if (grapeTimer >= 1200) {
                    clearInterval(grapeInterval);
                    document.querySelectorAll('.all-grapes').forEach(g => g.remove());

                    body.classList.add('white-bg');
                    midori.classList.add('show');

                    setTimeout(() => {
                        challengeBtn.classList.add('show');
                    }, 800);
                }
            }, 50);
        }

        function throwNikuman() {
            const body = document.body;
            const nikuman = document.getElementById('nikuman');
            const midori = document.getElementById('midori-chan');
            const box = document.getElementById('welcome-box');
            const boxTitle = document.getElementById('box-title');
            const boxText = document.getElementById('box-text');
            const boxGuide = document.getElementById('box-guide');
            
            const rect = midori.getBoundingClientRect();
            const faceX = rect.left + rect.width * 0.5;
            const faceY = rect.top + rect.height * 0.3;

            // チャレンジボタンを消す
            document.getElementById('challenge-btn').classList.remove('show');

            // 肉まんを顔面に命中
            nikuman.style.left = faceX + 'px';
            nikuman.style.top = faceY + 'px';
            nikuman.style.opacity = '1';
            nikuman.style.transform = 'translate(-50%, -50%) scale(1.3) rotate(15deg)';

            // 1秒後に肉まんを消し、さらに立ち絵も消して背景を元に戻す
            setTimeout(() => {
                nikuman.style.transition = 'opacity 0.3s ease';
                nikuman.style.opacity = '0';

                // 立ち絵をスッと消す
                midori.classList.remove('show');
                // 白背景を元に戻す
                body.classList.remove('white-bg');

                // ちょっとしてから中央に「NEXT！」ボタンを出す
                setTimeout(() => {
                    boxTitle.innerHTML = '<span>🚀 NEXT！</span>';
                    boxText.style.display = 'none'; // テキスト欄は非表示にしてスッキリさせる
                    boxGuide.innerText = '👇 タップして次へ！';
                    
                    // 次の処理用（後で変更可能）
                    box.onclick = function() {
                        alert('次の演出はここに実装予定！');
                    };

                    box.classList.remove('hide');
                }, 500);

            }, 1000); // 1秒表示
        }
    </script>

</body>
</html>
